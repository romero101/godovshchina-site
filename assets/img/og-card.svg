<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Квадратный холст под рендер qlmanage; карточка 1200×630 лежит в полосе y=285…915 -->
  <rect width="1200" height="1200" fill="#EEF3F0"/>
  <g transform="translate(0,285)">
    <rect x="0" y="0" width="1200" height="630" fill="#EEF3F0"/>
    <rect x="0" y="0" width="1200" height="14" fill="#0B7A5B"/>
    <text x="80" y="120" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="36" font-weight="800" fill="#14213D">Годов<tspan fill="#0B7A5B">щина</tspan></text>
    <text x="80" y="230" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="56" font-weight="800" fill="#14213D">Страховка ипотеки</text>
    <text x="80" y="298" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="56" font-weight="800" fill="#14213D">без переплаты</text>
    <text x="80" y="372" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="26" fill="#5C6B82">Полис или надбавка к ставке? Считаем за минуту</text>
    <text x="80" y="410" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="26" fill="#5C6B82">и сравниваем 14 страховых из списка Сбербанка.</text>
    <rect x="80" y="470" width="400" height="62" rx="14" fill="#0B7A5B"/>
    <text x="280" y="511" text-anchor="middle" font-family="Manrope, 'IBM Plex Sans', Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">polis-godovshchina.ru</text>
    <g fill="#FFFFFF" stroke="#DDE3EC">
      <rect x="800" y="120" width="320" height="84" rx="14"/>
      <rect x="800" y="226" width="320" height="84" rx="14"/>
      <rect x="800" y="332" width="320" height="84" rx="14"/>
    </g>
    <g font-family="'IBM Plex Sans', Arial, sans-serif" font-size="19" fill="#5C6B82">
      <text x="824" y="152">Отказаться от страховки</text>
      <text x="824" y="258">Полис в банке</text>
      <text x="824" y="364" fill="#14213D" font-weight="700">Полис из списка банка</text>
    </g>
    <g font-family="'IBM Plex Mono', Menlo, monospace" font-size="26" font-weight="700">
      <text x="824" y="188" fill="#B4530A">21 500 ₽</text>
      <text x="824" y="294" fill="#5C6B82">13 500 ₽</text>
      <text x="824" y="400" fill="#075C44">9 000 ₽</text>
    </g>
    <text x="824" y="470" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="16" fill="#5C6B82">в год на остатке 2 150 000 ₽</text>
  </g>
</svg>
